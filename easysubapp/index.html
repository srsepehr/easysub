<style>
  html { background: #0B0B0C; }
  body { margin: 0; background: #0B0B0C; color: #FAFAFA; font-family: "Vazirmatn", sans-serif; }
  html[lang="en"] body { font-family: "Sora", sans-serif; }
  spline-viewer { display: block; width: 100%; height: 100%; }
  ::selection { background: #9FFF00; color: #000; }
  * { scrollbar-width: thin; scrollbar-color: #2a2a2e transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 99px; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  input, textarea, select, button { font-family: inherit; }
  .liquid-glass {
    background: rgba(255,255,255,0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%,
      rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%,
      rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .liquid-glass-strong {
    background: rgba(255,255,255,0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: none;
    box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.5) 0%,
      rgba(255,255,255,0.2) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.2) 80%,
      rgba(255,255,255,0.5) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  @keyframes heroZoom { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100%{transform:translateX(0)} 15%{transform:translateX(-6px)} 30%{transform:translateX(6px)} 45%{transform:translateX(-5px)} 60%{transform:translateX(5px)} 75%{transform:translateX(-3px)} 90%{transform:translateX(3px)} }
  .btn-shake { animation: shake 0.45s ease; }
  /* Animated gradient border for input boxes on focus — mirrors the CTA hover-border look */
  @keyframes esSpin { to { transform: rotate(360deg); } }
  .es-input-anim { position: relative; isolation: isolate; }
  .es-input-anim::before {
    content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.95) 60deg, transparent 150deg, transparent 210deg, rgba(255,255,255,0.95) 300deg, transparent 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 2;
  }
  .es-input-anim:focus-within::before { opacity: 1; animation: esSpin 2.2s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .es-input-anim:focus-within::before { animation: none; } }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  .animate-fade-up { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .hero-zoom { animation: heroZoom 1.8s cubic-bezier(0.16,1,0.3,1) forwards; }
  @media (prefers-reduced-motion: reduce) { .hero-zoom { animation: none; } }

  /* Fix 1 — Focus states for keyboard users */
  :where(button, a, input, textarea, select, [role="button"], [role="slider"], [tabindex]):focus-visible {
    outline: 2px solid rgba(255,255,255,0.85);
    outline-offset: 2px;
    border-radius: inherit;
  }

  /* Fix 4 — Touch play hint */
  @media (hover: none) {
    .touch-play-hint { opacity: 0.4 !important; }
  }
  @media (hover: hover) {
    .touch-play-hint { opacity: 0; }
    .group:hover .touch-play-hint { opacity: 1; }
  }

  /* Fix 8 — Honor prefers-reduced-motion globally */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>

const applyLangDom = () => {
  document.documentElement.setAttribute("dir", window.__LANG === "en" ? "ltr" : "rtl");
  document.documentElement.setAttribute("lang", window.__LANG);
};
applyLangDom();
const setLang = (l) => {
  window.__LANG = l;

};

const simpleHash = (s) => {
  let h = 5381;
  for (let i = 0; i < String(s).length; i++) h = ((h << 5) + h + String(s).charCodeAt(i)) | 0;
  return "es" + Math.abs(h).toString(36);
};
const getAccounts = () => { try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || "{}"); } catch (e) { return {}; } };
const saveAccounts = (a) => { try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); } catch (e) {} };

const hasSub = (u) => !!u && (u.email === ADMIN_EMAIL || (u.plan && u.plan !== "free" && u.expires && u.expires > Date.now()));
const createAccount = (email, password, name) => {
  email = String(email || "").toLowerCase().trim();
  const a = getAccounts();
  if (a[email]) return { error: t("این ایمیل قبلاً ثبت شده است. وارد شوید یا رمز را بازنشانی کنید.", "This email is already registered. Log in or reset your password.") };
  const u = {
    name: name || email.split("@")[0], email, passwordHash: simpleHash(password),
    plan: email === ADMIN_EMAIL ? "pro" : "free",
    expires: email === ADMIN_EMAIL ? Date.now() + 360 * 24 * 3600 * 1000 : 0,
    joined: Date.now(),
  };
  a[email] = u; saveAccounts(a);
  return { user: u };
};
const verifyLogin = (email, password) => {
  email = String(email || "").toLowerCase().trim();
  const acc = getAccounts()[email];
  if (!acc || acc.passwordHash !== simpleHash(password)) return { error: t("ایمیل یا رمز عبور اشتباه است.", "Email or password is incorrect.") };
  return { user: acc };
};
const upgradePlan = (email, plan) => {
  email = String(email || "").toLowerCase().trim();
  const a = getAccounts();
  if (!a[email]) return;
  a[email].plan = plan;
  a[email].expires = Date.now() + 30 * 24 * 3600 * 1000;
  saveAccounts(a);
};

/* ---------- Password reset (emailed 6-digit code; demo keeps it in sessionStorage) ---------- */
const RESET_KEY = "easysub_pending_reset";
const generateResetCode = (email) => {
  const code = String(Math.floor(100000 + Math.random() * 900000));
  try { sessionStorage.setItem(RESET_KEY, JSON.stringify({ email: String(email).toLowerCase(), code, expires: Date.now() + 10 * 60 * 1000 })); } catch (e) {}
  return code;
};
const verifyResetCode = (email, code) => {
  try {
    const d = JSON.parse(sessionStorage.getItem(RESET_KEY) || "null");
    return !!d && d.email === String(email).toLowerCase() && d.code === String(code).trim() && d.expires > Date.now();
  } catch (e) { return false; }
};
const applyNewPassword = (email, password) => {
  email = String(email || "").toLowerCase().trim();
  const a = getAccounts();
  if (!a[email]) return false;
  a[email].passwordHash = simpleHash(password); saveAccounts(a);
  try { sessionStorage.removeItem(RESET_KEY); } catch (e) {}
  return true;
};

const loginUser = (info = {}) => {
  const prev = getUser() || {};
  const email = String(info.email || prev.email || "").toLowerCase().trim();
  const acc = (email && getAccounts()[email]) || {};
  const u = {
    name: info.name || acc.name || prev.name || (email ? email.split("@")[0] : "کاربر EasySub"),
    email: email || "",
    plan: acc.plan || info.plan || prev.plan || "free",
    expires: acc.expires != null ? acc.expires : (info.expires != null ? info.expires : (prev.expires || 0)),
    joined: acc.joined || prev.joined || Date.now(),
  };
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(u)); } catch (e) {}
  window.dispatchEvent(new Event("easysub:auth"));
  return u;
};
const logoutUser = () => {
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  window.dispatchEvent(new Event("easysub:auth"));
};
const daysLeft = (u) => Math.max(0, Math.ceil(((u && u.expires || Date.now()) - Date.now()) / 86400000));
const useUser = () => {
  const [u, setU] = React.useState(getUser);

    const on = () => setU(getUser());
    window.addEventListener("easysub:auth", on);
    return () => window.removeEventListener("easysub:auth", on);
  }, []);
  return u;
};

/* ---------- Library (real, persisted) — every processed video lives here ---------- */
const LIB_KEY = "easysub_library";
window.__EASYSUB_SESSION = window.__EASYSUB_SESSION || {}; // in-session media (blob urls) keyed by id
const getLibrary = () => { try { return JSON.parse(localStorage.getItem(LIB_KEY) || "[]"); } catch (e) { return []; } };
const saveToLibrary = (item) => {
  const lib = getLibrary().filter((x) => x.id !== item.id);
  // never persist blob: URLs (they die on reload) — keep those only in session
  const persist = { ...item };
  if (persist.mediaUrl && String(persist.mediaUrl).startsWith("blob:")) persist.mediaUrl = "";
  lib.unshift(persist);
  try { localStorage.setItem(LIB_KEY, JSON.stringify(lib.slice(0, 100))); } catch (e) {}
  window.__EASYSUB_SESSION[item.id] = item; // full item (with live blob) for this session
  window.dispatchEvent(new Event("easysub:library"));
  return item;
};
const getLibItem = (id) => window.__EASYSUB_SESSION[id] || getLibrary().find((x) => x.id === id) || null;
const removeFromLibrary = (id) => {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(getLibrary().filter((x) => x.id !== id))); } catch (e) {}
  delete window.__EASYSUB_SESSION[id];
  try { localStorage.removeItem("easysub_notes_" + id); } catch (e) {}
  window.dispatchEvent(new Event("easysub:library"));
};
const useLibrary = () => {
  const [lib, setLib] = React.useState(getLibrary);
  React.useEffect(() => {
    const on = () => setLib(getLibrary());
    window.addEventListener("easysub:library", on);
    return () => window.removeEventListener("easysub:library", on);
  }, []);
  return lib;
};

   Paste your Google OAuth Client ID below to enable real Google login.
   Get one free at: https://console.cloud.google.com/apis/credentials
   (Create OAuth client ID → Web application → add your Vercel domain to Authorized JS origins) */
const GOOGLE_CLIENT_ID = "";
const decodeJwt = (token) => {
  try { return JSON.parse(decodeURIComponent(atob(String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/")).split("").map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""))); }
  catch (e) { return null; }
};
const handleGoogleCredential = (resp) => {
  const p = decodeJwt(resp && resp.credential);
  if (!p || !p.email) return;
  const email = String(p.email).toLowerCase();
  if (!getAccounts()[email]) createAccount(email, "google-oauth-" + simpleHash(email), p.name || email.split("@")[0]);
  loginUser({ name: p.name || email.split("@")[0], email });
  const dest = getAfterLogin(); clearAfterLogin(); navigate(dest);
};

/* ---------- Routing ---------- */
const navigate = (path) => { window.location.hash = path; };
const goPricing = () => { navigate("/plans"); };
function parseHash() {
  const h = (window.location.hash || "#/").replace(/^#/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts.length === 0) return { page: "home" };
  if (parts[0] === "categories") return { page: "categories" };
  if (parts[0] === "category") return { page: "category", param: parts[1] };
  if (parts[0] === "watch") return { page: "watch", param: parts[1] };
  if (parts[0] === "studio") return { page: "studio" };
  if (parts[0] === "plans") return { page: "plans" };
  if (parts[0] === "demo") return { page: "demo" };
  if (parts[0] === "signup") return { page: "signup" };
  if (parts[0] === "login") return { page: "login" };
  if (parts[0] === "forgot") return { page: "forgot" };
  if (parts[0] === "contact") return { page: "contact" };
  if (parts[0] === "profile") return { page: "profile" };
  return { page: "notfound" };
}
function useHashRoute() {
  const [route, setRoute] = React.useState(parseHash);
  React.useEffect(() => {
    const onHash = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
}

function Reveal({ children, className = "", delay = 0, y = 16 }) {
  return (
    <motion.div className={className}
      initial={{ opacity: 0, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, amount: 0.2 }}

/* ---------- FadingVideo: rAF crossfade loop (no CSS transitions) ---------- */
function EsFadingVideo({ src, poster, endOffset = 0, className = "", style, ...rest }) {
  const ref = React.useRef(null);
  const rafRef = React.useRef(null);
  const fadingOutRef = React.useRef(false);
  React.useEffect(() => {
    const v = ref.current;
    if (!v) return;
    const FADE = 500, LEAD = 0.55;
    const fadeTo = (target, dur) => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      const start = parseFloat(v.style.opacity || "0");
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min((now - t0) / dur, 1);
        v.style.opacity = String(start + (target - start) * p);
        if (p < 1) rafRef.current = requestAnimationFrame(step);
      };
      rafRef.current = requestAnimationFrame(step);
    };
    const tryPlay = () => { v.muted = true; v.play().catch(() => {}); };
    const onLoaded = () => { v.style.opacity = "0"; tryPlay(); fadeTo(1, FADE); };
    const onTime = () => {
      const effEnd = v.duration - endOffset;
      const rem = effEnd - v.currentTime;
      if (!fadingOutRef.current && rem <= LEAD && rem > 0) { fadingOutRef.current = true; fadeTo(0, FADE); }
      if (endOffset > 0 && v.currentTime >= effEnd) onEnded();
    };
    const onEnded = () => {
      v.style.opacity = "0";
      setTimeout(() => { v.currentTime = 0; tryPlay(); fadingOutRef.current = false; fadeTo(1, FADE); }, 100);
    };
    v.addEventListener("loadeddata", onLoaded);
    v.addEventListener("timeupdate", onTime);
    v.addEventListener("ended", onEnded);
    tryPlay();
    const iv = setInterval(() => { if (v.paused) tryPlay(); }, 1500);
    const to = setTimeout(() => clearInterval(iv), 15000);
    return () => {
      clearInterval(iv); clearTimeout(to);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      v.removeEventListener("loadeddata", onLoaded);
      v.removeEventListener("timeupdate", onTime);
      v.removeEventListener("ended", onEnded);
    };
  }, [src]);
  return (
    <video ref={ref} src={src} poster={poster} autoPlay={!window.matchMedia("(prefers-reduced-motion: reduce)").matches} muted playsInline preload="auto"
      className={className} style={{ opacity: 0, ...style }} {...rest} />
  );
}

function HoverBorderGradient({ children, containerClassName = "", className = "", duration = 1, clockwise = true, ...props }) {
  const [hovered, setHovered] = React.useState(false);
  const [direction, setDirection] = React.useState("TOP");
  React.useEffect(() => {
    if (!hovered) {
      const interval = setInterval(() => {
        setDirection((prev) => {
          const dirs = ["TOP", "LEFT", "BOTTOM", "RIGHT"];
          const i = dirs.indexOf(prev);
          return clockwise ? dirs[(i - 1 + dirs.length) % dirs.length] : dirs[(i + 1) % dirs.length];
        });
      }, duration * 1000);
      return () => clearInterval(interval);
    }
  }, [hovered, duration, clockwise]);
  const movingMap = {
    TOP: "radial-gradient(20.7% 50% at 50% 0%, hsl(0, 0%, 100%) 0%, rgba(255, 255, 255, 0) 100%)",
    LEFT: "radial-gradient(16.6% 43.1% at 0% 50%, hsl(0, 0%, 100%) 0%, rgba(255, 255, 255, 0) 100%)",

  const highlight = "radial-gradient(75% 181.16% at 50% 50%, #ffffff 0%, rgba(255, 255, 255, 0) 100%)";

function AppleCarousel({ items }) {
  const ref = React.useRef(null);
  const animRef = React.useRef(null);
  /* vertical wheel → smooth horizontal glide (lets the page scroll once the strip hits an edge) */
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let target = null, raf = null;
    const settle = () => {
      raf = null; target = null;
      el.style.scrollSnapType = ""; // restore CSS snap once the glide finishes
    };
    const tick = () => {
      if (target == null) { settle(); return; }
      const before = el.scrollLeft;
      const diff = target - before;
      // scrollLeft is rounded to integers — settle within 2px or when a frame makes no progress
      if (Math.abs(diff) < 2) { el.scrollLeft = target; settle(); return; }
      el.scrollLeft += diff * 0.14;
      if (el.scrollLeft === before) { el.scrollLeft = target; settle(); return; }
      raf = requestAnimationFrame(tick);
    };
    const onWheel = (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // native horizontal gestures untouched
      const rtl = document.documentElement.dir !== "ltr";
      const span = el.scrollWidth - el.clientWidth;
      const min = rtl ? -span : 0, max = rtl ? 0 : span;
      const cur = target == null ? el.scrollLeft : target;
      const next = Math.max(min, Math.min(max, cur + (rtl ? -e.deltaY : e.deltaY)));
      if (Math.abs(next - cur) < 1) return; // at the edge — hand the wheel back to the page
      e.preventDefault();
      el.style.scrollSnapType = "none"; // Chrome re-snaps every programmatic scrollLeft write on a snap container
      target = next;
      if (!raf) raf = requestAnimationFrame(tick);
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => { el.removeEventListener("wheel", onWheel); if (raf) cancelAnimationFrame(raf); el.style.scrollSnapType = ""; };
  }, []);
  // RTL: content advances toward negative scrollLeft; LTR: positive. Animate manually (Chromium ignores smooth scrollBy in RTL snap containers)
  const scroll = (dir) => {
    const el = ref.current;
    if (!el) return;
    if (animRef.current) cancelAnimationFrame(animRef.current);
    el.style.scrollSnapType = "none"; // avoid per-frame re-snap during the eased animation
    const rtl = document.documentElement.dir !== "ltr";
    const card = el.querySelector("button");
    const amount = (card ? card.offsetWidth : 384) + 16;
    const from = el.scrollLeft;
    const to = from + dir * amount * (rtl ? 1 : -1);
    const t0 = performance.now(), DUR = 420;
    const ease = (p) => 1 - Math.pow(1 - p, 3);
    const step = (now) => {
      const p = Math.min((now - t0) / DUR, 1);
      el.scrollLeft = from + (to - from) * ease(p);
      if (p < 1) animRef.current = requestAnimationFrame(step);
      else { animRef.current = null; el.style.scrollSnapType = ""; }
    };
    animRef.current = requestAnimationFrame(step);
  };
  React.useEffect(() => () => { if (animRef.current) cancelAnimationFrame(animRef.current); }, []);
  return (
    <div className="relative w-full">
      <div ref={ref} className="flex w-full gap-4 overflow-x-auto no-scrollbar snap-x snap-proximity py-8 md:py-10 -mx-6 px-6 md:-mx-12 md:px-12">
        {items.map((v, i) => <AppleCard key={v.id} v={v} index={i} />)}
      </div>
      <div className="flex justify-end gap-2">
        <button type="button" onClick={() => scroll(1)} aria-label={t("قبلی", "Previous")}
          className="liquid-glass relative z-40 flex h-11 w-11 items-center justify-center rounded-full text-white hover:bg-white/10 active:scale-95 transition-all">
          <Ic name={back()} size={18} />
        </button>
        <button type="button" onClick={() => scroll(-1)} aria-label={t("بعدی", "Next")}
          className="liquid-glass relative z-40 flex h-11 w-11 items-center justify-center rounded-full text-white hover:bg-white/10 active:scale-95 transition-all">
          <Ic name={fwd()} size={18} />
        </button>
      </div>
    </div>
  );
}

/* ---- Section 2: cursor-spotlight reveal — what EasySub gives you ---- */
const SPOTLIGHT_R = 260;

function SpotlightSection() {
  const sectionRef = React.useRef(null);
  const revealRef = React.useRef(null);
  const mouse = React.useRef({ x: -9999, y: -9999 });
  const smooth = React.useRef({ x: -9999, y: -9999 });
  const rafRef = React.useRef(null);

  React.useEffect(() => {
    const el = sectionRef.current, d = revealRef.current;
    if (!el || !d) return;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const noHover = window.matchMedia("(hover: none)").matches;
    const applyMask = (x, y) => {
      const m = `radial-gradient(circle ${SPOTLIGHT_R}px at ${x}px ${y}px, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 45%, rgba(0,0,0,0.6) 66%, rgba(0,0,0,0.25) 82%, rgba(0,0,0,0) 100%)`;
      d.style.webkitMaskImage = m;
      d.style.maskImage = m;
    };
    if (reduced) {
      // static, centered reveal — no animation
      applyMask(el.offsetWidth / 2, el.offsetHeight * 0.45);
      return;
    }
    if (noHover) {
      // phones / no cursor: slow self-panning reveal
      smooth.current = { x: el.offsetWidth / 2, y: el.offsetHeight * 0.45 };
    }
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      mouse.current = { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    el.addEventListener("mousemove", onMove);
    let t = 0;
    const loop = () => {
      if (noHover) {
        t += 0.006;
        mouse.current = {
          x: el.offsetWidth * (0.5 + 0.32 * Math.sin(t)),
          y: el.offsetHeight * (0.45 + 0.14 * Math.cos(t * 0.7)),
        };
      }
      smooth.current.x += (mouse.current.x - smooth.current.x) * 0.12;
      smooth.current.y += (mouse.current.y - smooth.current.y) * 0.12;
      applyMask(smooth.current.x, smooth.current.y);
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => {
      el.removeEventListener("mousemove", onMove);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  const OFFERS = [
    { icon: "sparkles", t: t("زیرنویس هوشمند", "Smart subtitles"), d: t("هر ویدیویی، در چند دقیقه فارسی می‌شود.", "Any video becomes Persian in minutes.") },

    { icon: "fileText", t: t("یادداشت زمان‌دار", "Timestamped notes"), d: t("هر نکته به لحظهٔ خودش سنجاق می‌شود.", "Every insight pinned to its moment.") },
    { icon: "download", t: t("دانلود کامل", "Full downloads"), d: t("ویدیو و فایل srt، همیشه در دسترس تو.", "Video + .srt file, always yours.") },
  ];

  return (
    <section ref={sectionRef} className="relative w-full overflow-hidden bg-black" style={{ height: "100dvh", minHeight: 640 }}>
      {/* base image */}
      <div className="absolute inset-0 bg-center bg-cover bg-no-repeat z-10 hero-zoom" style={{ backgroundImage: `url(${SPOT_BASE})` }}></div>
      {/* cursor-reveal layer (CSS radial-gradient mask, driven by rAF) */}
      <div ref={revealRef} className="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none"
        style={{
          backgroundImage: `url(${SPOT_REVEAL})`,
          maskImage: "radial-gradient(circle 1px at -9999px -9999px, black, transparent)",
          WebkitMaskImage: "radial-gradient(circle 1px at -9999px -9999px, black, transparent)",
        }}></div>
      {/* scrim for legibility */}
      <div className="absolute inset-0 z-40 pointer-events-none bg-gradient-to-t from-black/95 via-black/10 to-black/70"></div>

      {/* heading */}
      <div className="absolute top-[13%] left-0 right-0 z-50 flex flex-col items-center text-center px-5 pointer-events-none">
        <Reveal>
          <h1 className="text-white leading-[1.1]" style={{ textShadow: "0 2px 28px rgba(0,0,0,0.85), 0 1px 4px rgba(0,0,0,0.6)" }}>
            <span className="block font-light text-4xl sm:text-6xl md:text-7xl text-white/90">{t("هر ویدیوی جهان،", "Every video on Earth,")}</span>
            <span className="block font-extrabold text-4xl sm:text-6xl md:text-7xl tracking-tight">{t("به زبان تو", "in your language")}</span>
          </h1>
          <p className="mt-5 text-sm sm:text-base text-white max-w-[44ch] mx-auto leading-7" style={{ textShadow: "0 1px 14px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,0.7)" }}>
            {t("موس را حرکت بده — همان‌طور که نور، تصویر را روشن می‌کند، EasySub محتوای جهان را برای تو روشن می‌کند.",
              "Move your mouse — the way light reveals the picture, EasySub reveals the world's content for you.")}

/* Ambient animated backdrop — Mux HLS stream via hls.js (native HLS on Safari) */
function HlsBgVideo({ src, className = "" }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const v = ref.current;
    if (!v) return;
    v.muted = true;
    let hls = null;
    if (v.canPlayType("application/vnd.apple.mpegurl")) {
      v.src = src;
    } else if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls();
      hls.loadSource(src);
      hls.attachMedia(v);
    }
    const tryPlay = () => v.play().catch(() => {});
    tryPlay();
    v.addEventListener("canplay", tryPlay);
    return () => { v.removeEventListener("canplay", tryPlay); if (hls) hls.destroy(); };
  }, [src]);
  return <video ref={ref} autoPlay={!window.matchMedia("(prefers-reduced-motion: reduce)").matches} muted loop playsInline className={className}></video>;
}

/* YouTube IFrame API — resolves once the global player API is ready */
let __ytReadyP = null;
function ytReady() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (__ytReadyP) return __ytReadyP;
  __ytReadyP = new Promise((resolve) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) { try { prev(); } catch (e) {} } resolve(); };
    const iv = setInterval(() => { if (window.YT && window.YT.Player) { clearInterval(iv); resolve(); } }, 200);
  });
  return __ytReadyP;
}

/* Unified Persian-subtitle player used on the Watch page.

function SubtitlePlayer({ item }) {
  const isYT = item.kind === "youtube" && !!item.youtubeId;
  const vref = React.useRef(null);
  const ytWrapRef = React.useRef(null);
  const ytRef = React.useRef(null);
  const [tm, setTm] = React.useState(0);
  const [dur, setDur] = React.useState(item.durationSec || 0);
  const [playing, setPlaying] = React.useState(false);
  const [subsOn, setSubsOn] = React.useState(true);
  const [speed, setSpeed] = React.useState(1);
  const cues = item.cues || [];
  const cur = subsOn ? cues.find((c) => tm >= c.start && tm <= c.end) : null;
  const hasMedia = isYT || !!item.mediaUrl;

  /* YouTube engine */
  React.useEffect(() => {
    if (!isYT) return;
    let poll = null, killed = false;
    ytReady().then(() => {
      if (killed || !ytWrapRef.current) return;
      ytRef.current = new window.YT.Player(ytWrapRef.current, {
        videoId: item.youtubeId,
        width: "100%", height: "100%",
        playerVars: { controls: 0, modestbranding: 1, rel: 0, iv_load_policy: 3, disablekb: 1, playsinline: 1, fs: 0 },
        events: {
          onReady: (e) => setDur(e.target.getDuration() || 0),
          onStateChange: (e) => { setPlaying(e.data === window.YT.PlayerState.PLAYING); },
        },
      });
      poll = setInterval(() => {
        const p = ytRef.current;
        if (p && p.getCurrentTime) { setTm(p.getCurrentTime() || 0); if (p.getDuration) { const d = p.getDuration(); if (d) setDur(d); } }
      }, 250);
    });
    return () => { killed = true; if (poll) clearInterval(poll); try { ytRef.current && ytRef.current.destroy(); } catch (e) {} };
  }, [isYT, item.youtubeId]);

  /* native <video> engine */
  React.useEffect(() => {
    if (isYT) return;
    const v = vref.current; if (!v) return;
    const onT = () => setTm(v.currentTime);
    const onD = () => setDur(v.duration || 0);
    const onP = () => setPlaying(true);
    const onPa = () => setPlaying(false);
    v.addEventListener("timeupdate", onT); v.addEventListener("loadedmetadata", onD);
    v.addEventListener("play", onP); v.addEventListener("pause", onPa);
    return () => { v.removeEventListener("timeupdate", onT); v.removeEventListener("loadedmetadata", onD); v.removeEventListener("play", onP); v.removeEventListener("pause", onPa); };
  }, [isYT]);

  const toggle = () => {
    if (isYT) { const p = ytRef.current; if (!p) return; if (playing) p.pauseVideo(); else p.playVideo(); return; }
    const v = vref.current; if (!v) return; if (v.paused) v.play(); else v.pause();

  const seekTo = (sec) => {
    sec = Math.max(0, Math.min(dur || 0, sec));

  const cycleSpeed = () => {
    const next = speed === 1 ? 1.5 : speed === 1.5 ? 2 : 1; setSpeed(next);
    if (isYT) { ytRef.current && ytRef.current.setPlaybackRate && ytRef.current.setPlaybackRate(next); }
    else if (vref.current) vref.current.playbackRate = next;
  };
  const download = (text, name, type) => {
    if (!text) return;
    const u = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1500);
  };

  /* notes — real, persisted per library item */
  const NKEY = "easysub_notes_" + item.id;
  const [notes, setNotes] = React.useState(() => { try { return JSON.parse(localStorage.getItem(NKEY) || "[]"); } catch (e) { return []; } });
  const [draft, setDraft] = React.useState("");

  const saveNotes = (next) => { setNotes(next); try { localStorage.setItem(NKEY, JSON.stringify(next)); } catch (e) {} };

function StudioInner() {
  const [mode, setMode] = React.useState("link"); // link | upload
  const [link, setLink] = React.useState("");
  const [file, setFile] = React.useState(null);
  const [fileName, setFileName] = React.useState("");
  const [stage, setStage] = React.useState("input"); // input | processing
  const [step, setStep] = React.useState(0);
  const [done, setDone] = React.useState(false);
  const [drag, setDrag] = React.useState(false);
  const [error, setError] = React.useState("");
  const fileInputRef = React.useRef(null);
  const newIdRef = React.useRef(null);
  const STEPS = studioSteps();

  const pickFile = (f) => {
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) {
      setError(t("فایل بیش از ۲۰ مگابایت است. یک کلیپ کوتاه‌تر انتخاب کن یا لینک یوتیوب/مستقیم بده.", "File exceeds 20 MB. Choose a shorter clip or paste a YouTube/direct link."));
      return;
    }
    setFile(f); setFileName(f.name); setError("");
  };
  const readBase64 = (f) => new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(String(rd.result).split(",")[1]);
    rd.onerror = rej;
    rd.readAsDataURL(f);
  });

  // Real pipeline: send the file/link to the serverless Gemini function,
  // store the Persian subtitles, then let the stepper finish + navigate.
  const runPipeline = async () => {
    try {
      let body;
      if (mode === "link") {
        body = { url: link.trim() };
      } else {
        if (file.size > 20 * 1024 * 1024) {
          throw new Error(t("حجم فایل زیاد است (حداکثر ۲۰ مگابایت برای آپلود مستقیم). یک کلیپ کوتاه‌تر آپلود کن یا لینک یوتیوب/مستقیم بده.", "File is too large (max 20 MB for direct upload). Upload a shorter clip or paste a YouTube/direct link."));
        }
        const b64 = await readBase64(file);
        body = { mediaBase64: b64, mimeType: file.type || "video/mp4" };
      }
      const r = await fetch("/api/subtitle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) throw new Error((data && data.error) || ("خطای سرور HTTP " + r.status));
      const url = mode === "link" ? link.trim() : "";
      const yid = mode === "link" ? ytId(url) : null;
      const kind = yid ? "youtube" : (mode === "link" ? "url" : "file");
      const name = mode === "link"
        ? (yid ? t("ویدیوی یوتیوب", "YouTube video") : url)
        : file.name;
      const item = {
        id: "lib_" + Date.now().toString(36),
        kind, name,
        youtubeId: yid || null,
        mediaUrl: kind === "youtube" ? "" : (mode === "link" ? url : URL.createObjectURL(file)),
        mimeType: mode === "link" ? "" : (file.type || "video/mp4"),
        thumb: yid ? ytThumb(yid) : "",
        cues: data.cues || [], srt: data.srt || "", vtt: data.vtt || "",
        durationSec: (data.cues && data.cues.length) ? Math.ceil(data.cues[data.cues.length - 1].end) : 0,
        createdAt: Date.now(),
      };
      saveToLibrary(item);
      window.__EASYSUB_RESULT = item;
      newIdRef.current = item.id;
      setDone(true);
    } catch (e) {
      // The API already returns Persian error messages — show them as-is
      const msg = String((e && e.message) || e);
      setError(msg || t("خطای ناشناخته‌ای رخ داد.", "An unknown error occurred."));
      setStage("input"); setStep(0); setDone(false);

  };

    if (step >= STEPS.length) {
      const tt = setTimeout(() => navigate("/watch/" + (newIdRef.current || "studio")), 700);
      return () => clearTimeout(tt);
    }
    // Hold on the final step until the real backend resolves (done = true).
    if (step >= STEPS.length - 1 && !done) return;
    const tt = setTimeout(() => setStep((s) => s + 1), 1300);
    return () => clearTimeout(tt);
  }, [stage, step, done]);

  const ready = mode === "link" ? !!link.trim() : !!file;
  const start = () => { if (!ready) return; setError(""); setStep(0); setDone(false); setStage("processing"); runPipeline(); };

  return (
    <div className="relative min-h-screen overflow-hidden bg-[#141414] flex flex-col">

/* Google Sign-In — renders the real GSI button when a Client ID is configured,
   otherwise a graceful fallback that still lets people continue. */
function GoogleSignInButton() {
  const ref = React.useRef(null);
  const [ready, setReady] = React.useState(false);
  React.useEffect(() => {
    if (!GOOGLE_CLIENT_ID) return;
    let tries = 0;
    const init = () => {
      if (window.google && window.google.accounts && window.google.accounts.id && ref.current) {
        try {
          window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
          window.google.accounts.id.renderButton(ref.current, { theme: "filled_black", size: "large", shape: "pill", width: 320, text: "continue_with" });
          setReady(true);
        } catch (e) {}
        return;
      }
      if (tries++ < 40) setTimeout(init, 150);
    };
    init();
  }, []);
  if (GOOGLE_CLIENT_ID) {
    return <div className="flex justify-center"><div ref={ref}></div>{!ready && <span className="text-xs text-white/40">{t("در حال بارگذاری گوگل…", "Loading Google…")}</span>}</div>;
  }
  // Supabase Google OAuth fallback (works without GOOGLE_CLIENT_ID)
  if (_sb) {
    const handleSupabaseGoogle = () => _sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin + window.location.pathname } });
    return (
      <button type="button" onClick={handleSupabaseGoogle}
        className="liquid-glass w-full flex items-center justify-center gap-2.5 h-12 rounded-full hover:bg-white/5 transition-colors text-sm text-white">
        <Ic name="chrome" size={17} /> {t("ادامه با گوگل", "Continue with Google")}
      </button>
    );
  }
  // No auth configured — fallback
  return (
    <button type="button" onClick={() => navigate("/signup")}
      className="liquid-glass w-full flex items-center justify-center gap-2.5 h-12 rounded-full hover:bg-white/5 transition-colors text-sm text-white">
      <Ic name="chrome" size={17} /> {t("ادامه با گوگل", "Continue with Google")}
    </button>
  );
}

  const triggerShake = () => {
    setShake(true);
    setTimeout(() => setShake(false), 500);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (pending) return;
    setErr("");
    setAttempted(true);
    if (!email.trim() || !pass) {
      setErr(t("لطفاً همهٔ فیلدها را پر کنید.", "Please fill in all fields."));
      triggerShake();
      return;

      setErr(t("ایمیل معتبر نیست.", "Please enter a valid email address."));

const PROFILE_BG_VIDEO = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_105406_16f4600d-7a92-4292-b96e-b19156c7830a.mp4";

/* ---- Library categories (localStorage) ---- */
const CATS_KEY = "easysub_lib_categories";
const getLibCats = () => { try { return JSON.parse(localStorage.getItem(CATS_KEY) || "[]"); } catch(e) { return []; } };
const saveLibCats = (cats) => { try { localStorage.setItem(CATS_KEY, JSON.stringify(cats)); } catch(e) {} };
const useLibCats = () => {
  const [cats, setCats] = React.useState(getLibCats);
  React.useEffect(() => {
    const onCat = () => setCats(getLibCats());
    window.addEventListener("easysub:cats", onCat);
    return () => window.removeEventListener("easysub:cats", onCat);
  }, []);
  const refresh = () => { setCats(getLibCats()); window.dispatchEvent(new Event("easysub:cats")); };
  const add = (name) => { const c = { id: "cat_" + Date.now().toString(36), name: name.trim(), createdAt: Date.now() }; saveLibCats([...getLibCats(), c]); refresh(); return c.id; };
  const remove = (id) => { saveLibCats(getLibCats().filter(c => c.id !== id)); refresh(); };
  return { cats, add, remove };
};
const setItemCategory = (itemId, catId) => {
  const lib = getLibrary();
  const idx = lib.findIndex(v => v.id === itemId);
  if (idx < 0) return;
  lib[idx].categoryId = catId || null;
  try { localStorage.setItem("easysub_library", JSON.stringify(lib)); window.dispatchEvent(new Event("easysub:library")); } catch(e) {}
};

function ProfileBgVideo() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const v = ref.current;
    if (!v) return;
    const tryPlay = () => { v.muted = true; v.play().catch(() => {}); };
    tryPlay();
    v.addEventListener("canplay", tryPlay);
    return () => v.removeEventListener("canplay", tryPlay);
  }, []);
  return <video ref={ref} src={PROFILE_BG_VIDEO} autoPlay={!window.matchMedia("(prefers-reduced-motion: reduce)").matches} loop muted playsInline preload="auto" className="w-full h-full object-cover"></video>;
}

    <div className="relative min-h-screen">
      <div className="absolute top-0 inset-x-0 h-[320px] overflow-hidden pointer-events-none">
        <div className="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-base"></div>
        <div className="absolute bottom-0 inset-x-0 h-40 bg-gradient-to-t from-base to-transparent"></div>
      </div>
      <div className="relative pt-28 pb-20">
        <section className="max-w-2xl mx-auto px-6 md:px-10">
          <Reveal>
            <div className="text-center mb-10">
              <span className="liquid-glass inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-[11px] font-semibold text-white">
                <Ic name="mail" size={12} /> {t("تماس با ما", "Contact us")}
              </span>
              <h1 className="mt-4 text-3xl font-extrabold tracking-tight">{t("با ما در تماس باش", "Get in touch")}</h1>
              <p className="mt-2 text-sm text-white/65 leading-7 max-w-md mx-auto">{t("سؤال، پیشنهاد یا گزارش مشکل داری؟ پیامت را بفرست — معمولاً در کمتر از ۲۴ ساعت جواب می‌دیم.", "Question, suggestion, or bug report? Send your message — we usually reply within 24 hours.")}</p>
            </div>
          </Reveal>
          {sent ? (
            <Reveal>
              <div className="liquid-glass-strong rounded-3xl p-10 text-center">
                <span className="mx-auto w-14 h-14 rounded-full bg-white text-black flex items-center justify-center mb-4"><Ic name="check" size={24} /></span>
                <h2 className="text-xl font-extrabold">{t("پیام ارسال شد!", "Message sent!")}</h2>
                <p className="mt-2 text-sm text-white/65 leading-7">{t("ممنون که با ما در تماس گذاشتی. به‌زودی جواب می‌دیم.", "Thanks for reaching out. We'll get back to you soon.")}</p>
                <button type="button" onClick={() => { setSent(false); setForm({ name: "", email: "", subject: "", message: "" }); }} className="mt-6 liquid-glass rounded-full px-6 h-11 text-sm hover:bg-white/10 transition-colors">
                  {t("ارسال پیام جدید", "Send another message")}
                </button>
              </div>
            </Reveal>
          ) : (
            <Reveal>
              <form onSubmit={submit} noValidate className="liquid-glass-strong rounded-3xl p-7 sm:p-9 space-y-5">
                <div className="grid sm:grid-cols-2 gap-5">
                  <div className="space-y-2">
                    <label className="text-sm font-medium">{t("نام *", "Name *")}</label>
                    <input value={form.name} onChange={set("name")} placeholder={t("نام شما", "Your name")} className="w-full h-11 rounded-xl bg-white/5 border border-white/10 px-4 text-sm focus-visible:ring-2 focus-visible:ring-white/70 placeholder:text-white/40 focus:outline-none" />
                  </div>
                  <div className="space-y-2">
                    <label className="text-sm font-medium">{t("ایمیل *", "Email *")}</label>
                    <input value={form.email} onChange={set("email")} type="email" placeholder="you@example.com" dir="ltr" style={{ textAlign: "left" }} className="w-full h-11 rounded-xl bg-white/5 border border-white/10 px-4 text-sm focus-visible:ring-2 focus-visible:ring-white/70 placeholder:text-white/40 focus:outline-none" />
                  </div>
                </div>
                <div className="space-y-2">
                  <label className="text-sm font-medium">{t("موضوع", "Subject")}</label>
                  <input value={form.subject} onChange={set("subject")} placeholder={t("موضوع پیام چیست؟", "What's this about?")} className="w-full h-11 rounded-xl bg-white/5 border border-white/10 px-4 text-sm focus-visible:ring-2 focus-visible:ring-white/70 placeholder:text-white/40 focus:outline-none" />
                </div>
                <div className="space-y-2">
                  <label className="text-sm font-medium">{t("پیام *", "Message *")}</label>
                  <textarea value={form.message} onChange={set("message")} rows={5} placeholder={t("پیام خود را بنویسید…", "Write your message…")} className="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm focus-visible:ring-2 focus-visible:ring-white/70 placeholder:text-white/40 resize-none focus:outline-none"></textarea>
                </div>
                {err && <p className="text-[13px] text-red-300/90">{err}</p>}
                <button type="submit" disabled={pending} className="w-full h-12 rounded-full bg-white text-black font-bold text-sm hover:bg-white/90 active:scale-[0.98] transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                  {pending ? t("در حال ارسال…", "Sending…") : t("ارسال پیام", "Send message")}
                </button>
              </form>
            </Reveal>
          )}
          <Reveal delay={0.15}>
            <div className="mt-8 grid sm:grid-cols-2 gap-4">
              {[[t("ایمیل مستقیم", "Direct email"), "hello@easysub.app", "mail"], [t("اینستاگرام", "Instagram"), "@easysub.app", "instagram"]].map(([label, val, icon]) => (
                <div key={label} className="liquid-glass rounded-2xl p-5 flex items-center gap-3">
                  <span className="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center shrink-0"><Ic name={icon} size={18} /></span>
                  <div className="min-w-0">
                    <div className="text-xs text-white/60">{label}</div>
                    <div className="text-sm font-semibold truncate" dir="ltr">{val}</div>
                  </div>
                </div>
              ))}
            </div>
          </Reveal>
        </section>
      </div>
    </div>
  );
}

function App() {
  const route = useHashRoute();
  const [lang, setLangState] = React.useState(window.__LANG);
  React.useEffect(() => {
    const onLang = () => setLangState(window.__LANG);
    window.addEventListener("easysub:lang", onLang);
    return () => window.removeEventListener("easysub:lang", onLang);
  }, []);

  const bare = route.page === "signup" || route.page === "login" || route.page === "forgot"; // auth = self-contained moment

  // gate the pages that need a real account
  const needsAuth = route.page === "studio" || route.page === "profile";
  if (needsAuth && !isLoggedIn()) {
    return (
      <div key={lang} data-screen-label="login" className="relative">
        <LoginPage />
      </div>
    );
  }

  let page = null;
  if (route.page === "home") page = <HomePage />;
  else if (route.page === "categories") page = <CategoriesPage />;
  else if (route.page === "category") page = <CategoryPage slug={route.param} />;
  else if (route.page === "watch") page = <WatchPage id={route.param} />;
  else if (route.page === "studio") page = <StudioPage />;
  else if (route.page === "plans") page = <PlansPage />;
  else if (route.page === "demo") page = <DemoPage />;
  else if (route.page === "signup") page = <SignupPage />;
  else if (route.page === "login") page = <LoginPage />;
  else if (route.page === "forgot") page = <ForgotPasswordPage />;
  else if (route.page === "contact") page = <ContactPage />;
  else if (route.page === "profile") page = <ProfilePage />;
  else if (route.page === "notfound") page = <NotFoundPage />;

  if (bare) {
    return (
      <div key={lang} data-screen-label={route.page} className="relative">
        {page}
      </div>
    );
  }

  return (
    <div key={lang} data-screen-label={route.page}>
      <Header transparentTop={route.page === "home" || route.page === "categories" || route.page === "category"} showLang={route.page === "home"} />
      {page}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
